name: Task 4 API Checks

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "artifacts/**"
      - "tests/test_member4_api.py"
      - "requirements.txt"
      - ".github/workflows/task4-api-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "artifacts/**"
      - "tests/test_member4_api.py"
      - "requirements.txt"
      - ".github/workflows/task4-api-checks.yml"
  workflow_dispatch:

jobs:
  api-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Task 4 API checks
        run: python -m pytest -v tests/test_member4_api.py
